# Values come from .env; each service lists only what it needs (the worker takes all of .env).
x-database: &database
  DATABASE_URL: ${DATABASE_URL:-postgres://otter:${POSTGRES_PASSWORD:-otter}@postgres:5432/otter}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: otter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otter}
      POSTGRES_DB: otter
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "otter"]
      interval: 5s

  api:
    build: { context: ., args: { APP: api } }
    # Internet-facing: never the GitHub App key, the gateway secret or the LLM key.
    environment:
      <<: *database
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    # /admin has its own port, reachable only from this machine (ssh -L 3001:localhost:3001 on a server)
    ports: ["3000:3000", "127.0.0.1:3001:3001"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: { context: ., args: { APP: worker } }
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *database
      LLM_API_KEY: "" # the real key lives only in the gateway; reviewers get a per-review token
    volumes:
      - otter-data:/var/otter # the launcher mounts each worktree from it into its reviewer
    networks: [default, launcher]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      gateway: { condition: service_healthy }
      launcher: { condition: service_healthy }

  # The only service with the Docker socket (= root on the host): it runs reviewer containers on its own
  # terms, for the worker alone. Nothing secret in its environment.
  launcher:
    build: { context: ., args: { APP: launcher } }
    environment:
      REVIEWER_IMAGE: ${REVIEWER_IMAGE:-}
      REVIEWER_NETWORK: ${REVIEWER_NETWORK:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      DOCKER_CONFIG: /tmp/.docker # the docker CLI's config dir, on a read-only filesystem
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      launcher: { aliases: [otter-launcher] }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 5s

  gateway:
    build: { context: ., args: { APP: gateway } }
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-}
      GATEWAY_REVIEW_MAX_REQUESTS: ${GATEWAY_REVIEW_MAX_REQUESTS:-}
      GATEWAY_REVIEW_MAX_TOKENS: ${GATEWAY_REVIEW_MAX_TOKENS:-}
      GATEWAY_DAILY_MAX_TOKENS: ${GATEWAY_DAILY_MAX_TOKENS:-}
    networks:
      default: {}
      reviewers: { aliases: [otter-gateway] }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s

  reviewer:
    build: { context: ., args: { APP: reviewer } }
    image: code-otter-reviewer
    profiles: ["build-only"]

networks:
  reviewers:
    name: otter-reviewers
    internal: true
  # Worker ↔ launcher only: neither the internet-facing api nor the reviewers can reach the socket's owner.
  launcher:
    name: otter-launcher
    internal: true

volumes:
  pgdata:
  otter-data:
    name: otter-data # fixed: the launcher names it in `docker run --mount`
